    const problemDecks=new Map();
    const lastProblems=new Map();
    function shuffle(list){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}
    function combinations(size,count){const result=[];function add(start,chosen){if(chosen.length===count){result.push([...chosen]);return}for(let i=start;i<=size-(count-chosen.length);i++){chosen.push(i);add(i+1,chosen);chosen.pop()}}add(0,[]);return result}
    function makeProblem(store,level,kind,pool=null,variant='all'){
      const settings=(kind==='mission'?missionLevels:practiceLevels)[level];
      const candidates=pool??Array.from({length:store.items.length},(_,i)=>i);
      const key=`${kind}:${store.id}:${level}:${variant}`;
      let deck=problemDecks.get(key);
      if(!deck?.length){deck=shuffle(combinations(candidates.length,settings.count).map(indices=>indices.map(i=>candidates[i])));if(deck.length>1&&deck.at(-1).join(',')===lastProblems.get(key)){[deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]]}problemDecks.set(key,deck)}
      const target=deck.pop();
      lastProblems.set(key,target.join(','));
      const others=shuffle(Array.from({length:store.items.length},(_,i)=>i).filter(i=>!target.includes(i))).slice(0,settings.pool-settings.count);
      return {target,visible:shuffle([...target,...others])};
    }
    const won=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';
    const moneyValues=[50000,10000,5000,1000,500,100];
    const moneyName=value=>`${won(value)} ${value>=1000?'지폐':'동전'}`;
    function moneyToken(value,index,selected=false){const type=value>=1000?'지폐':'동전';const unit=value>=1000?'장':'개';return `<button class="money-button ${value>=1000?'note':'coin'} money-${value} ${selected?'picked':''}" type="button" data-${selected?'remove-money':'money'}="${value}" aria-label="${won(value)} ${type} ${index+1}${unit}${selected?' 빼기':' 고르기'}"><span class="money-unit" aria-hidden="true">${type} 1${unit}</span><strong>${won(value)}</strong>${selected?'<span class="money-action" aria-hidden="true">− 빼기</span>':''}</button>`}
    function makeWallet(amount,level){
      const wallet=Object.fromEntries(moneyValues.map(value=>[value,0]));
      let remaining=amount;
      moneyValues.forEach(value=>{wallet[value]=Math.floor(remaining/value);remaining%=value});
      const splitSteps={easy:0,normal:1,hard:2,challenge:3}[level]??0;
      const splits=[[10000,5000,2],[1000,500,2],[500,100,5],[50000,10000,5],[5000,1000,5]];
      for(let step=0;step<splitSteps;step++){
        const choice=splits.find(([larger,smaller,count])=>wallet[larger]>0&&Object.values(wallet).reduce((sum,n)=>sum+n,0)+count-1<=16);
        if(!choice)break;
        const [larger,smaller,count]=choice;wallet[larger]--;wallet[smaller]+=count;
      }
      const answer={...wallet};
      const extras={easy:1,normal:2,hard:3,challenge:4}[level]??1;
      const candidates=moneyValues.filter(value=>value<=amount);
      for(let i=0;i<extras;i++)wallet[candidates[(i*2+Math.floor(Math.random()*candidates.length))%candidates.length]]++;
      return {wallet,answer};

    function variableGuideText(clip){

      if(clip==='A05')return `내야 할 돈은 ${won(total())}입니다. ${paymentRule(game)}`;
      if(clip==='A06')return `물건값은 ${won(total())}입니다. 내가 가진 돈은 ${moneyValues.filter(value=>game.wallet[value]>0).map(value=>`${moneyName(value)} ${game.wallet[value]-(game.paid[value]||0)}${value>=1000?'장':'개'}`).join(', ')}입니다. 지금 낸 돈은 ${won(paidTotal())}입니다.`;
      if(clip==='A07')return `물건값은 ${won(total())}입니다. ${won(game.tender)}을 냈어요.`;
      if(clip==='A08')return `카드로 결제할 금액은 ${won(total())}입니다.`;

      return '';

    function playGuide(clip){
      stopGuide();
      const fallback=guideText();
      const changingValues=variableGuideText(clip);
      let usedFallback=false;
      const useFallback=()=>{if(!usedFallback){usedFallback=true;speakFallback(fallback)}};
      guideAudio.onerror=useFallback;
      guideAudio.onended=()=>{if(changingValues&&!usedFallback)speakFallback(changingValues)};
      guideAudio.src=`audio/${clip}.mp3`;
      const playing=guideAudio.play();
      if(playing?.catch)playing.catch(useFallback);

    function updateTabs(){document.querySelector('.mode-nav').classList.toggle('hidden',mode==='home'||!!game);document.getElementById('go-home').classList.toggle('hidden',mode==='home');document.getElementById('practice-level-wrap').classList.toggle('hidden',!['practice','shopping'].includes(mode)||!!game);document.querySelector('#practice-level-wrap .difficulty-title').innerHTML=mode==='shopping'?'물건 담기 난이도<small>담을 물건 수가 달라져요.</small>':'연습 난이도<small>살 물건 수와 사용할 돈이 달라져요.</small>';for(const [id,value] of [['shopping-tab','shopping'],['practice-tab','practice'],['mission-tab','mission']]){const b=document.getElementById(id);b.classList.toggle('active',mode===value);if(mode===value)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}}
    function showMode(next){stopGuide();mode=next;game=null;feedback='';feedbackClip='';updateTabs();if(mode==='home')renderLanding();else if(mode==='mission')renderMissionHome();else renderHome()}
    function renderLanding(){main.innerHTML=`<section class="landing" aria-labelledby="landing-title"><div class="landing-heading"><p class="eyebrow">물건 계산 연습</p><h2 id="landing-title">무엇을 해 볼까요?</h2><p>하고 싶은 활동을 골라 주세요.</p></div><div class="landing-options"><button class="landing-option shopping-option" id="start-shopping" type="button"><span class="landing-option-icon" aria-hidden="true">🛍️</span><span class="landing-option-body"><strong>물건 담기</strong><span>목록을 보고 물건만 담아요.</span></span><span class="landing-option-go" aria-hidden="true">시작하기 →</span></button><button class="landing-option practice-option" id="start-practice" type="button"><span class="landing-option-icon" aria-hidden="true">🛒</span><span class="landing-option-body"><strong>연습하기</strong><span>물건을 담고 계산까지 해요.</span></span><span class="landing-option-go" aria-hidden="true">시작하기 →</span></button><button class="landing-option mission-option" id="start-mission" type="button"><span class="landing-option-icon" aria-hidden="true">📋</span><span class="landing-option-body"><strong>미션하기</strong><span>미션에 적힌 물건을 사 와요.</span></span><span class="landing-option-go" aria-hidden="true">시작하기 →</span></button></div></section>`;document.getElementById('start-shopping').onclick=()=>showMode('shopping');document.getElementById('start-practice').onclick=()=>showMode('practice');document.getElementById('start-mission').onclick=()=>showMode('mission')}
    function renderHome(){stopGuide();game=null;feedback='';feedbackClip='';updateTabs();main.innerHTML=`<p class="intro">${mode==='shopping'?'어느 가게에서 물건을 담을까요? 가게를 하나 골라 주세요.':'어디에서 물건을 살까요? 가게를 하나 골라 주세요.'}</p><div class="place-grid">${stores.map(s=>`<button class="place" data-store="${s.id}" type="button"><span class="emoji" aria-hidden="true">${s.icon}</span><strong>${s.name}</strong><span class="place-sub">${s.sub}</span></button>`).join('')}</div>`;main.querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>start(b.dataset.store));}
    function newMission(){

    function missionText(info){const names=info.target.map(i=>info.store.items[i][0]);const last=names[names.length-1];const code=last.charCodeAt(last.length-1);const particle=code>=44032&&code<=55203&&(code-44032)%28?'을':'를';return `${info.store.name}에서 ${names.join(', ')}${particle} 사 와요.`}

      main.querySelectorAll('[data-mission-level]').forEach(button=>button.onclick=()=>{if(missionLevel!==button.dataset.missionLevel){missionLevel=button.dataset.missionLevel;mission=null;newMission()}});

      });

    function start(id,missionData){stopGuide();const store=stores.find(s=>s.id===id);const problem=missionData?{target:[...missionData.target],visible:[...missionData.visible]}:makeProblem(store,practiceLevel,mode==='shopping'?'shopping':'practice');game={store,...problem,scene:missionData?.scene??null,requiredPayment:missionData?.requiredPayment??null,mode:missionData?'mission':mode,level:missionData?missionLevel:practiceLevel,chosen:[],stage:'shop',payment:null,tender:0,wallet:null,cashAnswer:null,paid:{},cardSelected:false};feedback='';feedbackClip='';help=false;updateTabs();render();}

    function drawStage(){const el=document.getElementById('stage'),s=game.stage;let html='';
      if(s==='shop'){const shopping=game.mode==='shopping';html=`<p class="eyebrow">${shopping?'물건 담기 연습':'1단계 · 물건 담기'}</p><h2 class="stage-title">${shopping?'목록에 있는 물건을 담아요':'살 물건을 담아요'}</h2><p class="stage-desc">목록에 있는 물건을 눌러 장바구니에 담아요. 다시 누르면 뺄 수 있어요.</p><div class="product-grid">${game.visible.map(i=>{const item=game.store.items[i];return `<button type="button" class="product ${game.chosen.includes(i)?'selected':''}" data-item="${i}" aria-pressed="${game.chosen.includes(i)}"><span class="check">${game.chosen.includes(i)?'✓':''}</span>${itemArt(item)}<strong>${item[0]}</strong>${shopping?'':`<span class="price">${won(item[1])}</span>`}</button>`}).join('')}</div><div class="action-row"><button class="primary" id="check-cart" type="button">${shopping?'담은 물건 확인하기':'계산하러 가기'}</button></div>`}

      if(s==='card'){html=`<p class="eyebrow">3단계 · 카드로 결제하기</p><h2 class="stage-title">카드를 투입구에 넣어요</h2><p class="stage-desc">결제할 금액은 <strong>${won(total())}</strong>이에요. 카드를 끌어 투입구에 놓아요.</p><div class="card-workspace"><div class="card-place"><span class="card-place-label">① 카드를 잡아요</span><button class="practice-card ${game.cardSelected?'selected':''}" id="practice-card" type="button" aria-pressed="${game.cardSelected}" aria-label="연습용 카드. 투입구로 끌거나 누르세요."><span class="card-chip" aria-hidden="true"></span><strong>연습용 카드</strong><small>실제 결제는 이루어지지 않아요</small></button></div><span class="card-arrow" aria-hidden="true">→</span><div class="card-place"><span class="card-place-label">② 투입구에 넣어요</span><button class="card-dropzone" id="card-dropzone" type="button" aria-label="카드 투입구. 카드를 끌어 놓거나 카드를 누른 뒤 여기를 누르세요."><span class="card-reader"><span class="reader-screen">카드 투입구</span><span class="reader-slot" aria-hidden="true"></span><span class="reader-light" aria-hidden="true"></span></span></button></div></div><p class="card-help">끌기가 어렵다면 카드를 누르고, 투입구를 누르세요.</p><p class="card-feedback" id="card-feedback" role="status" aria-live="polite">카드를 투입구에 넣어 주세요.</p><div class="action-row"><button class="secondary" id="change-pay" type="button">결제 방법 다시 고르기</button></div>`}
      if(s==='receipt'){let t=total();html=`<p class="eyebrow">4단계 · 영수증 보기</p><h2 class="stage-title">영수증 금액이 맞나요?</h2><p class="stage-desc">물건값과 영수증 금액을 비교해요.</p><div class="receipt" aria-label="영수증"><h3>${game.store.name}</h3><div class="receipt-center">영수증</div><hr>${game.target.map(i=>`<div class="receipt-row"><span>${game.store.items[i][0]}</span><span>${won(game.store.items[i][1])}</span></div>`).join('')}<hr><div class="receipt-row bold"><span>결제 금액</span><span>${won(t)}</span></div><div class="receipt-row"><span>결제 방법</span><span>${game.payment==='cash'?'현금':'카드'}</span></div><div class="receipt-foot">구매해 주셔서 감사합니다</div></div><div class="choices"><button class="choice" data-receipt="yes" type="button">✅ 맞아요</button><button class="choice" data-receipt="no" type="button">🔎 달라요</button></div>${help?`<div class="help-box">물건값을 더하면 ${won(t)}이에요. 영수증에도 ${won(t)}이라고 적혀 있어요.</div>`:''}<div class="action-row"><button class="secondary" id="hint" type="button">💡 ${help?'도움 닫기':'영수증 도움 보기'}</button></div>`}
      if(s==='done'){const shopping=game.mode==='shopping';html=`<div class="success"><div class="emoji" aria-hidden="true">${shopping?'🛒':'🎉'}</div><h2>${shopping?'물건을 모두 담았어요!':game.mode==='mission'?'미션 완료!':'잘했어요!'}</h2><p>${shopping?`${game.store.name}에서 목록에 있는 물건을 모두 담았어요.`:`${game.store.name}에서 물건을 고르고 계산하고 영수증까지 확인했어요.`}</p>${shopping?`<ul class="shopping-done-list">${game.target.map(i=>`<li>${itemArt(game.store.items[i])}<span>${game.store.items[i][0]}</span></li>`).join('')}</ul>`:`<div class="money-big">정확한 금액 ${won(total())}</div>`}<div class="action-row" style="justify-content:center"><button class="primary" id="again" type="button">${game.mode==='mission'?'같은 미션 다시 하기':'같은 가게 다시 하기'}</button><button class="secondary" id="other" type="button">${game.mode==='mission'?'다음 미션 받기':'다른 가게 고르기'}</button></div></div>`}
      el.innerHTML=html;bindStage();}
    function bindStage(){const s=game.stage;
      if(s==='shop'){document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{let i=+b.dataset.item;game.chosen=game.chosen.includes(i)?game.chosen.filter(x=>x!==i):[...game.chosen,i];feedback='';render()});document.getElementById('check-cart').onclick=()=>{let same=game.chosen.length===game.target.length&&game.target.every(i=>game.chosen.includes(i));if(same){game.stage=game.mode==='shopping'?'done':'total';feedback='';help=false;render()}else note('목록에 있는 물건만 담아 주세요. 장바구니를 다시 살펴봐요.','try',game.mode==='shopping'?'':'B02')}}
      if(s==='total'){document.querySelectorAll('[data-total]').forEach(b=>b.onclick=()=>{if(+b.dataset.total===total()){game.stage='payment';feedback='';help=false;render()}else note('다시 더해 봐요. 물건값을 하나씩 살펴봐요.','try','B03')});document.getElementById('hint').onclick=()=>{help=!help;drawStage()}}
      if(s==='payment'){document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{if(game.requiredPayment&&b.dataset.pay!==game.requiredPayment){note(`이번 미션은 ${paymentRule(game)} 다시 골라 주세요.`);return}game.payment=b.dataset.pay;game.stage=game.payment;if(game.stage==='card')game.cardSelected=false;if(game.stage==='cash'&&!game.wallet){const cash=makeWallet(total(),game.level);game.wallet=cash.wallet;game.cashAnswer=cash.answer;game.paid={}}feedback='';help=false;render()})}
      if(s==='cash'){
        document.querySelectorAll('[data-money]').forEach(b=>b.onclick=()=>{const value=+b.dataset.money;if((game.paid[value]||0)<game.wallet[value]){game.paid[value]=(game.paid[value]||0)+1;feedback='';render()}});
        document.querySelectorAll('[data-remove-money]').forEach(b=>b.onclick=()=>{const value=+b.dataset.removeMoney;game.paid[value]--;feedback='';render()});
        document.getElementById('reset-cash').onclick=()=>{game.paid={};feedback='';render()};
        document.getElementById('hint').onclick=()=>{help=!help;drawStage()};
        document.getElementById('submit-cash').onclick=()=>{const amount=paidTotal();if(amount<total())note(`아직 ${won(total()-amount)}이 부족해요. 가진 돈을 더 눌러 보세요.`,'try','B04');else{game.tender=amount;game.stage=amount===total()?'receipt':'change';feedback='';help=false;render()}};
      }
      if(s==='change'){document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{if(+b.dataset.change===game.tender-total()){game.stage='receipt';feedback='';help=false;render()}else note('낸 돈에서 물건값을 빼 봐요.','try','B05')});document.getElementById('hint').onclick=()=>{help=!help;drawStage()}}
      if(s==='card'){
        const card=document.getElementById('practice-card'),zone=document.getElementById('card-dropzone'),message=document.getElementById('card-feedback');
        let drag=null,suppressClick=false;
        const inside=(x,y)=>{const r=zone.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom};
        const finish=()=>{game.cardSelected=false;game.stage='receipt';feedback='';render()};
        card.onpointerdown=e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};card.setPointerCapture(e.pointerId)};
        card.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(!drag.moved)return;card.style.transform=`translate(${dx}px,${dy}px)`;card.classList.add('dragging');zone.classList.toggle('drop-ready',inside(e.clientX,e.clientY))};
        const endDrag=e=>{if(!drag||drag.id!==e.pointerId)return;const moved=drag.moved,dropped=e.type==='pointerup'&&moved&&inside(e.clientX,e.clientY);drag=null;card.classList.remove('dragging');zone.classList.remove('drop-ready');card.style.transform='';if(moved)suppressClick=true;if(dropped){finish();return}if(moved)message.textContent='투입구 안에 놓아 주세요. 다시 해 봐요.'};
        card.onpointerup=endDrag;card.onpointercancel=endDrag;
        card.onclick=()=>{if(suppressClick){suppressClick=false;return}game.cardSelected=!game.cardSelected;card.classList.toggle('selected',game.cardSelected);card.setAttribute('aria-pressed',String(game.cardSelected));message.textContent=game.cardSelected?'이제 투입구를 누르세요.':'카드를 투입구에 넣어 주세요.'};
        zone.onclick=()=>{if(game.cardSelected)finish();else message.textContent='먼저 카드를 누르거나 끌어 주세요.'};
        document.getElementById('change-pay').onclick=()=>{game.cardSelected=false;game.stage='payment';render()};
      }
      if(s==='receipt'){document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>{if(b.dataset.receipt==='yes'){game.stage='done';feedback='';render()}else note('물건값과 영수증의 결제 금액이 같아요. 다시 살펴봐요.','try','B06')});document.getElementById('hint').onclick=()=>{help=!help;drawStage()}}
      if(s==='done'){document.getElementById('again').onclick=()=>start(game.store.id,game.mode==='mission'?game:undefined);document.getElementById('other').onclick=()=>game.mode==='mission'?newMission():renderHome()}}
    document.getElementById('shopping-tab').onclick=()=>showMode('shopping');
    document.getElementById('practice-tab').onclick=()=>showMode('practice');
    document.getElementById('mission-tab').onclick=()=>showMode('mission');
    document.getElementById('go-home').onclick=()=>showMode('home');
    document.querySelectorAll('[data-practice-level]').forEach(button=>button.onclick=()=>{if(practiceLevel===button.dataset.practiceLevel)return;practiceLevel=button.dataset.practiceLevel;document.querySelectorAll('[data-practice-level]').forEach(option=>option.setAttribute('aria-pressed',String(option.dataset.practiceLevel===practiceLevel)));if(['practice','shopping'].includes(mode)&&game)start(game.store.id)});
    function guideText(){
      if(!game){
        if(mode==='home')return '물건 계산하기 게임입니다. 물건 담기, 연습하기, 미션하기 중에서 골라 주세요.';
        if(mode==='mission')return `${mission.scene.prompt} ${missionText(mission)} ${paymentRule(mission)} 장소와 구매 물건을 살펴본 뒤, 해당하는 가게를 누르세요.`;
        if(mode==='shopping')return '물건 담기 연습입니다. 난이도를 고르고 가게를 누르세요. 목록에 있는 물건만 담으면 끝나요.';
        return '연습하기입니다. 먼저 가게를 고르세요. 가게를 누르면 살 물건이 나옵니다.';
      }
      const itemNames=game.target.map(i=>game.store.items[i][0]).join(', ');
      const feedbackText=document.querySelector('.main-card .feedback')?.textContent;
      if(feedbackText)return feedbackText;
      if(game.stage==='shop')return `${game.mode==='shopping'?'담을':'사야 할'} 물건은 ${itemNames}입니다. 같은 물건을 눌러 장바구니에 담으세요. 모두 담았으면 ${game.mode==='shopping'?'담은 물건 확인하기':'계산하러 가기'}를 누르세요.`;
      if(game.stage==='total')return `장바구니에 담은 물건의 가격을 더해 보세요. ${game.target.map(i=>`${game.store.items[i][0]} ${won(game.store.items[i][1])}`).join(', ')}입니다. 모두 얼마인지 알맞은 금액을 누르세요.`;
      if(game.stage==='payment')return `내야 할 돈은 ${won(total())}입니다. ${game.requiredPayment?paymentRule(game):'현금 또는 카드 중에서 결제 방법을 골라 주세요.'}`;
      if(game.stage==='cash')return `물건값은 ${won(total())}입니다. 내가 가진 돈은 ${moneyValues.filter(value=>game.wallet[value]>0).map(value=>`${moneyName(value)} ${game.wallet[value]-(game.paid[value]||0)}${value>=1000?'장':'개'}`).join(', ')}입니다. 지금 낸 돈은 ${won(paidTotal())}입니다. 지폐나 동전을 누른 뒤, 현금으로 결제하기를 누르세요.`;
      if(game.stage==='change')return `물건값은 ${won(total())}입니다. ${won(game.tender)}을 냈어요. 낸 돈에서 물건값을 빼고, 받을 거스름돈을 누르세요.`;
      if(game.stage==='card')return `카드로 결제할 금액은 ${won(total())}입니다. 연습용 카드를 투입구로 끌어 놓으세요. 끌기가 어렵다면 카드를 누른 뒤 투입구를 누르세요.`;
      if(game.stage==='receipt')return `영수증의 결제 금액은 ${won(total())}입니다. 물건값과 비교하세요. 같으면 맞아요, 다르면 달라요를 누르세요.`;
      if(game.mode==='shopping')return '목록에 있는 물건을 모두 담았어요. 같은 가게에서 다시 하거나 다른 가게를 고를 수 있어요.';
      return game.mode==='mission'?'미션을 마쳤습니다. 같은 미션을 다시 하거나 다음 미션을 받을 수 있습니다.':'계산을 마쳤습니다. 같은 가게에서 다시 연습하거나 다른 가게로 갈 수 있습니다.';
    }
    document.getElementById('speak').onclick=()=>{if(mode==='home'||mode==='shopping'||game?.stage==='card'||(game?.stage==='payment'&&game.requiredPayment)){stopGuide();speakFallback(guideText())}else playGuide(screenClip())};
    showMode('home');
  </script>
</body>
</html>
